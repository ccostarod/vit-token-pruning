experiment:
  name: hybrid_history_pruning_conservative
  seed: 42

paths:
  data_dir: ./dataset
  checkpoint_dir: ./checkpoints
  results_dir: ./results/hybrid_history_pruning_conservative

dataset:
  image_size: 224
  num_classes: 102
  batch_size: 32
  num_workers: 2
  download: true
  augmentation: true
  random_erasing_p: 0.09852543003845121

model:
  name: vit_base_patch16_224.augreg_in21k
  pretrained: false
  init_checkpoint: ./checkpoints/optuna_best_best.pth

pruning:
  method: hybrid_history
  score_method: token_norm
  prune_layers: [1, 3, 6]
  keep_ratios: [0.8, 0.65, 0.55]
  preserve_order: true
  history:
    min_long_history: 2
    beta_short: 0.2
    beta_long: 0.1
    alpha_ema: 0.1
    gamma: 0.8
    stability_weight: 0.0
    normalize_scores: true
    eps: 0.000001

training:
  epochs: 30
  lr: 0.0000606870627400301
  weight_decay: 0.007716841118309199
  label_smoothing: 0.2912737878542151
  mixup_alpha: 0.8830736738977027
  early_stopping:
    enabled: true
    monitor: val_accuracy
    mode: max
    patience: 7
    min_delta: 0.0
